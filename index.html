<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Rent Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">Split Rent Calculator</h1>
  <p class="text-gray-500 text-center mb-8">Divide rent fairly among roommates</p>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
      <div>
        <label for="total-rent" class="block text-sm font-medium text-gray-700 mb-1">Total Monthly Rent ($)</label>
        <input id="total-rent" type="number" min="0" placeholder="e.g. 3000"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          oninput="calculate()" aria-label="Total monthly rent in dollars">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Split Mode</label>
        <div class="flex rounded-lg overflow-hidden border border-gray-300">
          <button id="btn-prop" onclick="setMode('proportional')"
            class="flex-1 py-2 text-sm font-medium bg-blue-500 text-white transition-colors" aria-pressed="true">
            By Room Size
          </button>
          <button id="btn-equal" onclick="setMode('equal')"
            class="flex-1 py-2 text-sm font-medium bg-white text-gray-600 transition-colors" aria-pressed="false">
            Equal Split
          </button>
        </div>
      </div>
    </div>

    <div class="space-y-3" id="roommates-container">
    </div>

    <button onclick="addRoommate()"
      class="mt-4 w-full py-2 border-2 border-dashed border-gray-300 rounded-lg text-sm text-gray-500 hover:border-blue-400 hover:text-blue-500 transition-colors"
      id="add-btn" aria-label="Add a roommate">
      + Add Roommate
    </button>
  </div>

  <div id="results-area" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-gray-700">Monthly Shares</h2>
      <button onclick="copyResults()" id="copy-btn"
        class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-medium hover:bg-blue-100 transition-colors"
        aria-label="Copy results to clipboard">
        Copy to clipboard
      </button>
    </div>
    <div id="results-table" class="overflow-x-auto">
    </div>
    <div id="total-check" class="mt-3 text-xs text-gray-400 text-right"></div>
  </div>
</div>

<script>
let mode = 'proportional';
let roommates = [];

function init() {
  addRoommate('Alice', 120);
  addRoommate('Bob', 100);
  addRoommate('Carol', 80);
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-prop').className = 'flex-1 py-2 text-sm font-medium transition-colors ' +
    (m === 'proportional' ? 'bg-blue-500 text-white' : 'bg-white text-gray-600');
  document.getElementById('btn-equal').className = 'flex-1 py-2 text-sm font-medium transition-colors ' +
    (m === 'equal' ? 'bg-blue-500 text-white' : 'bg-white text-gray-600');
  document.getElementById('btn-prop').setAttribute('aria-pressed', m === 'proportional' ? 'true' : 'false');
  document.getElementById('btn-equal').setAttribute('aria-pressed', m === 'equal' ? 'true' : 'false');
  renderRoommateInputs();
  calculate();
}

function addRoommate(name = '', sqft = '') {
  if (roommates.length >= 5) return;
  const id = Date.now() + Math.random();
  roommates.push({ id, name, sqft });
  renderRoommateInputs();
  calculate();
  if (roommates.length >= 5) {
    document.getElementById('add-btn').disabled = true;
    document.getElementById('add-btn').classList.add('opacity-40', 'cursor-not-allowed');
  }
}

function removeRoommate(id) {
  roommates = roommates.filter(r => r.id !== id);
  renderRoommateInputs();
  calculate();
  const btn = document.getElementById('add-btn');
  btn.disabled = false;
  btn.classList.remove('opacity-40', 'cursor-not-allowed');
}

function renderRoommateInputs() {
  const container = document.getElementById('roommates-container');
  container.innerHTML = '';
  roommates.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-3';
    const nameId = 'name-' + r.id;
    const sqftId = 'sqft-' + r.id;
    row.innerHTML = `
      <div class="flex-1">
        <label for="${nameId}" class="block text-xs text-gray-500 mb-0.5">Roommate ${i + 1} Name</label>
        <input id="${nameId}" type="text" placeholder="Name" value="${escHtml(r.name)}"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          oninput="updateRoommate(${r.id}, 'name', this.value)" aria-label="Roommate ${i + 1} name">
      </div>
      ${mode === 'proportional' ? `
      <div class="w-28">
        <label for="${sqftId}" class="block text-xs text-gray-500 mb-0.5">Room sq ft</label>
        <input id="${sqftId}" type="number" min="1" placeholder="sq ft" value="${r.sqft}"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          oninput="updateRoommate(${r.id}, 'sqft', this.value)" aria-label="Room size in square feet for roommate ${i + 1}">
      </div>` : ''}
      <button onclick="removeRoommate(${r.id})" class="mt-4 text-gray-400 hover:text-red-400 transition-colors text-lg leading-none" aria-label="Remove roommate ${i + 1}">×</button>
    `;
    container.appendChild(row);
  });
}

function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function updateRoommate(id, field, val) {
  const r = roommates.find(r => r.id === id);
  if (r) { r[field] = val; calculate(); }
}

function calculate() {
  const totalRent = parseFloat(document.getElementById('total-rent').value) || 0;
  if (totalRent <= 0 || roommates.length === 0) {
    document.getElementById('results-area').classList.add('hidden');
    return;
  }

  let shares = [];
  if (mode === 'equal') {
    const share = totalRent / roommates.length;
    shares = roommates.map(r => ({ name: r.name || '(unnamed)', share, pct: (100 / roommates.length) }));
  } else {
    const sqfts = roommates.map(r => parseFloat(r.sqft) || 0);
    const totalSqft = sqfts.reduce((a, b) => a + b, 0);
    if (totalSqft <= 0) {
      document.getElementById('results-area').classList.add('hidden');
      return;
    }
    shares = roommates.map((r, i) => {
      const pct = (sqfts[i] / totalSqft) * 100;
      return { name: r.name || '(unnamed)', sqft: sqfts[i], pct, share: (sqfts[i] / totalSqft) * totalRent };
    });
  }

  document.getElementById('results-area').classList.remove('hidden');
  const tableEl = document.getElementById('results-table');
  let html = '<table class="w-full text-sm"><thead><tr class="border-b border-gray-100">';
  html += '<th class="text-left py-2 pr-4 font-semibold text-gray-500">Roommate</th>';
  if (mode === 'proportional') html += '<th class="text-right py-2 pr-4 font-semibold text-gray-500">Room (sq ft)</th>';
  html += '<th class="text-right py-2 pr-4 font-semibold text-gray-500">Share %</th>';
  html += '<th class="text-right py-2 font-semibold text-gray-500">Monthly Rent</th>';
  html += '</tr></thead><tbody class="divide-y divide-gray-50">';

  shares.forEach(s => {
    html += '<tr>';
    html += `<td class="py-2 pr-4 font-medium text-gray-800">${escHtml(s.name)}</td>`;
    if (mode === 'proportional') html += `<td class="py-2 pr-4 text-right text-gray-600">${s.sqft}</td>`;
    html += `<td class="py-2 pr-4 text-right text-gray-600">${s.pct.toFixed(1)}%</td>`;
    html += `<td class="py-2 text-right font-bold text-gray-800">$${s.share.toFixed(2)}</td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  tableEl.innerHTML = html;

  const totalShares = shares.reduce((a, s) => a + s.share, 0);
  document.getElementById('total-check').textContent = 'Total: $' + totalShares.toFixed(2) + ' of $' + totalRent.toFixed(2);
}

function copyResults() {
  const totalRent = parseFloat(document.getElementById('total-rent').value) || 0;
  let lines = ['Rent Split Summary', 'Total Monthly Rent: $' + totalRent.toFixed(2), ''];
  const rows = document.querySelectorAll('#results-table tbody tr');
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    const name = cells[0].textContent;
    const share = cells[cells.length - 1].textContent;
    lines.push(name + ': ' + share + '/mo');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy to clipboard', 2000);
  });
}

init();
</script>
</body>
</html>
